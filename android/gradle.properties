org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Pin the Gradle daemon to Java 17. Android Studio's bundled JBR runtime can
# be newer than what Gradle 8.12's Kotlin DSL script compiler supports
# (fails with "IllegalArgumentException: <version>" while parsing
# build.gradle.kts/settings.gradle.kts) - this makes every Gradle invocation
# use a known-good JDK regardless of which JVM launched the wrapper.
# If this path doesn't exist on your machine, install Temurin 17
# (`brew install --cask temurin17`) or point this at any JDK 17-21 you have.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home
