name: mining
description: "Virtual Mining Empire - virtual mining/farm progression app."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management / architecture
  get: ^4.6.6

  # Backend
  supabase_flutter: ^2.8.0

  # UI
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  lottie: ^3.2.0

  # Local storage / utils
  shared_preferences: ^2.3.5
  intl: ^0.19.0
  uuid: ^4.5.1
  package_info_plus: ^8.1.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # Auth providers (optional - require console setup, see README)
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3

  # Firebase (optional - requires google-services.json / GoogleService-Info.plist, see README)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  flutter_local_notifications: ^18.0.1

  # Monetization (optional - requires AdMob app id, see README)
  google_mobile_ads: ^5.1.0

  # Real-money purchases - Google Play Billing (coin packs + Extra Mining
  # Time), verified server-side by verify-play-purchase.
  in_app_purchase: ^3.3.1

  # Crash reports
  firebase_crashlytics: ^4.3.10
  timezone: ^0.10.1
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  # Custom fonts: drop Poppins .ttf files into assets/fonts/ and uncomment
  # (see README "Branding & assets" section).
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
